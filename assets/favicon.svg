<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ngGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151D" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#ngGrad)" stroke-width="2.5" />
  <!-- Monogram NG -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="url(#ngGrad)" text-anchor="middle" letter-spacing="-0.5">NG</text>
  <!-- Accent Glow Dot -->
  <circle cx="49" cy="17" r="3.5" fill="#60A5FA" opacity="0.9" />
